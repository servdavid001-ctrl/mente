name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/android-apk.yml']
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Install mobile deps
        working-directory: mobile
        run: npm install
      - name: Add Android platform
        working-directory: mobile
        run: npx cap add android
      - name: Build debug APK
        working-directory: mobile/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Rename APK
        run: cp mobile/android/app/build/outputs/apk/debug/app-debug.apk Mente.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Mente-APK
          path: Mente.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Mente APK ${{ github.run_number }}
          files: Mente.apk
          make_latest: true
